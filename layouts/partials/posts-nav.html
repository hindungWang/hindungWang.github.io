<div id="reading-progress" aria-hidden="true"></div>
<aside class="posts-nav" aria-label="所有文章">
  <h3>文章<span class="posts-nav-count">{{ len (where .Site.RegularPages "Type" "post") }}</span></h3>
  <ul>
    {{ $posts := where .Site.RegularPages "Type" "post" }}
    {{ range $posts.ByDate.Reverse }}
      <li class="{{ if eq .RelPermalink $.RelPermalink }}active{{ end }}">
        <a href="{{ .RelPermalink }}" title="{{ .Title }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</aside>
<script>
  (function () {
    var bar = document.getElementById('reading-progress');
    if (!bar) return;
    var update = function () {
      var doc = document.documentElement;
      var total = doc.scrollHeight - doc.clientHeight;
      bar.style.transform = 'scaleX(' + (total > 0 ? window.scrollY / total : 0) + ')';
    };
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();
</script>
