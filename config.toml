baseURL = "https://hindungwang.github.io/"
defaultContentLanguage = "cn-zh"
enableEmoji = true
enableRobotsTXT = true
languageCode = "cn-zh"
# Syntax highlighting: class-based tokens, colors defined in static/css/chroma.css
pygmentsStyle = "github"
pygmentsUseClasses = true
theme = "gokarna"
title = "Hindung's Blog"

[params]
  avatarAltText = "avatar"
  avatarSize = "size-m"
  avatarURL = "https://github.com/hindungWang.png"

  description = "✏️网络笔记📒"
  footer = "HindungWang"
  metaKeywords = ["blog", "gokarna", "hugo"]
  showBackToTopButton = true # true or false for "back to top" button on posts and pages

  CustomHeadHTML = """
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  """

  # 消息网关配置（game-agent-chat 组件读取）
  # 注意：baseUrl/token 会随构建渲染进公开页面；token 是低权限的，真正防护靠网关限流。
  # token 留空时聊天窗自动进入本地演示模式。
  [params.gameAgent]
    baseUrl = "https://wrongly-disrupt-outreach.ngrok-free.dev"   # 公网网关（ngrok 静态域名，可信证书，访客零配置）
    token = "92091a6d9b7f1f212523b393a6ec23655920f5170e564904"   # 网关 Bearer token；留空 = 演示模式
    replyMode = "poll"                  # poll（推荐）/ sync

  socialIcons = [
    {name = "twitter", url = "https://example.com"},
    {name = "linkedin", url = "https://example.com"},
    {name = "stackoverflow", url = "https://example.com"},
    {name = "dribbble", url = "https://example.com"},
    {name = "instagram", url = "https://example.com"},
    {name = "twitch", url = "https://example.com"},
    {name = "email", url = "mailto:example@example.com"}
  ]

[menu]
  [[menu.main]]
    name = "Home"
    pre = "<span data-feather='home'></span>"
    url = "/"
    weight = 1
  
  [[menu.main]]
    name = "About"
    pre = "<span data-feather='home'></span>"
    url = "/about"
    weight = 2

  [[menu.main]]
    name = "Posts"
    pre = "<span data-feather='page'></span>"
    url = "/posts/"
    weight = 3

  [[menu.main]]
    name = "Game Agent"
    pre = "<span data-feather='gamepad'></span>"
    url = "/game-agent/"
    weight = 4

  [[menu.main]]
    name = "Tags"
    pre = "<span data-feather='tag'></span>"
    url = "/tags/"
    weight = 5

  [[menu.main]]
    identifier = "github"
    pre = "<span data-feather='github'></span>"
    url = "https://github.com/hindungWang"
    weight = 5

  [[menu.main]]
    identifier = "buymeacoffee"
    pre = "<span data-feather='coffee'></span>"
    url = "https://buymeacoffee.com/hindung"
    weight = 6

  [[menu.main]]
    identifier = "rss"
    pre = "<span data-feather='rss'></span>"
    url = "/index.xml"
    weight = 7

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[minify]
    minifyOutput = true
